[project]
name = "fit-stitch"
version = "0.1.0"
description = "Stitch multiple Garmin FIT activity files into one spec-compliant activity accepted by Garmin Connect"
authors = [{ name = "Vimo Swim Sp. z o.o.", email = "contact@vimoswim.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fit", "garmin", "cycling", "swimming", "merge", "tcx", "garmin-connect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "fit-tool (>=0.9.16,<0.10.0)",
    "garmin-fit-sdk (>=21.0.0,<22.0.0)",
]

[project.urls]
Homepage = "https://github.com/vimoswim/fit-stitch"
Issues = "https://github.com/vimoswim/fit-stitch/issues"

[project.scripts]
fit-stitch = "fit_stitch.cli:main"

[tool.poetry]
packages = [{ include = "fit_stitch", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
